<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23111111%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2230%22%20font-weight%3D%22700%22%20fill%3D%22%23e2b93a%22%20text-anchor%3D%22middle%22%3E48%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141414">
<title>Pannello · Via Roma 48</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  /* identità Cameriere Virtuale: rosso, nero, bianco */
  --black:#141414; --black-2:#232323; --black-3:#2f2f2f;
  --red:#c8102e; --red-600:#a80d26; --red-700:#8a0a1f; --red-100:#fbd9de; --red-50:#fdf0f2;
  --bg:#f5f4f2; --card:#ffffff; --ink:#151515; --ink-2:#3d3d3d; --muted:#6b6b6b; --line:#e4e1dd; --soft:#f0eeeb;
  --green:#147a3d; --green-50:#e9f6ee; --amber:#9a5b00; --amber-50:#fff5e3; --blue:#1d4ed8; --blue-50:#eef3ff;
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --side:248px; --r:14px;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.tn{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- accesso ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--black)}
.gate form{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:30px 24px;text-align:center}
.gate .logo{width:52px;height:52px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-weight:800;font-size:22px}
.gate h1{margin:0;font-size:22px;font-weight:800}
.gate p{margin:6px 0 18px;color:var(--muted)}
.gate input{width:100%;height:58px;border:2px solid var(--line);border-radius:14px;text-align:center;font-size:26px;letter-spacing:.4em;background:var(--soft)}
.gate input:focus{border-color:var(--black);background:#fff;outline:none}
.gate .err{color:var(--red);font-weight:700;min-height:1.4em;margin:12px 0 0}

/* ---------- struttura ---------- */
.shell{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--black);color:#fff;display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .2s ease;padding:16px 12px;overflow-y:auto}
.side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:#b8b8b8;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8d8d8d;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:11px;color:#d9d9d9;font-weight:600;font-size:14.5px;text-align:left}
.nav button:hover{background:var(--black-2);color:#fff}
.nav button[aria-current="page"]{background:var(--black-3);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.side .foot{border-top:1px solid #2c2c2c;margin-top:12px;padding-top:12px;font-size:12px;color:#9a9a9a;display:flex;align-items:center;gap:8px}
.collapse{display:none}
.mainwrap{min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(245,244,242,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:64px}
.hamb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tacts{display:flex;gap:8px;align-items:center}
.ib{position:relative;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{border-color:#cfcac4}
.ib[aria-pressed="true"]{background:var(--black);color:#fff;border-color:var(--black)}
.ib .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.conn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.conn i{width:9px;height:9px;border-radius:99px;background:var(--green);flex-shrink:0}
.conn.off{background:var(--red-50);border-color:var(--red-100);color:var(--red-700)}
.conn.off i{background:var(--red)}
.conn.wait i{background:#b7b7b7}
.vlink{height:44px;padding:0 14px;border-radius:12px;background:var(--black);color:#fff;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
main{padding:18px 16px 110px;max-width:1280px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-50);border-radius:8px;padding:3px 8px}
@media (max-width:719px){ .conn span,.vlink span{display:none} .conn{padding:0 14px} .vlink{width:44px;padding:0;justify-content:center} .ttl h1{font-size:19px} .top{gap:8px;padding:10px 12px} }
@media (max-width:520px){ .vlink{display:none} .tacts{gap:6px} .ib,.conn,.hamb{width:42px;height:42px} .conn{padding:0;justify-content:center} .qa-row .btn{flex:1 1 calc(50% - 8px)} }
@media (min-width:1024px){
  .side{transform:none;box-shadow:none}
  .scrim{display:none}
  .mainwrap{margin-left:var(--side)}
  .hamb{display:none}
  .collapse{display:flex}
  body.mini{--side:76px}
  body.mini .brand div,body.mini .nav span.t,body.mini .nav .grp,body.mini .side .foot span{display:none}
  body.mini .nav button{justify-content:center;padding:0}
  body.mini .nav .cnt{position:absolute;margin:0;transform:translate(14px,-12px);min-width:18px;height:18px;font-size:10.5px}
  body.mini .nav button{position:relative}
  .top{padding:12px 28px}
  main{padding:24px 28px 110px}
}
/* durante il servizio su tablet: menu laterale ridotto per dare spazio alle comande */
@media (min-width:1024px) and (max-width:1439px){
  body.svcmini{--side:76px}
  body.svcmini .brand div,body.svcmini .nav span.t,body.svcmini .nav .grp,body.svcmini .side .foot span{display:none}
  body.svcmini .nav button{justify-content:center;padding:0;position:relative}
  body.svcmini .nav .cnt{position:absolute;margin:0;transform:translate(14px,-12px);min-width:18px;height:18px;font-size:10.5px}
}

/* ---------- elementi comuni ---------- */
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;border:1px solid transparent}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-600)}
.btn.dark{background:var(--black);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#cfcac4}
.btn.ok{background:var(--green);color:#fff}
.btn.warn{background:var(--red-50);color:var(--red-700);border-color:var(--red-100)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:56px;font-size:16px;padding:0 20px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.busy{opacity:.7;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card>h2,.ch h2{margin:0;font-size:16.5px;font-weight:800}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch .lnk{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--red-700);display:inline-flex;align-items:center;gap:4px;min-height:36px}
.sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);font-weight:500}
.state{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:34px 12px;font-size:14px}
.state .i{width:28px;height:28px;color:#b1aca6}
.state.err{color:var(--red-700)}
.state.err .i{color:var(--red)}
.state b{color:var(--ink);font-size:15px}
.spin{width:26px;height:26px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--red);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;gap:14px}
.g2{display:grid;gap:14px}
@media (min-width:900px){ .g2{grid-template-columns:repeat(2,minmax(0,1fr))} }
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field textarea,.field select,.inp{min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;font-weight:500;background:#fff;color:var(--ink);width:100%}
.field textarea,textarea.inp{min-height:90px;padding:10px 12px;resize:vertical;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--black)}
.field.bad input,.field.bad textarea{border-color:var(--red)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chk{display:flex;align-items:flex-start;gap:10px;font-weight:600;font-size:14.5px;min-height:32px}
.chk input{width:22px;height:22px;accent-color:var(--red);margin:0;flex-shrink:0}
.chk small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--black);color:#fff}
.seg .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--soft);font-size:11.5px;display:inline-grid;place-items:center;color:var(--ink-2)}
.seg button[aria-pressed="true"] .n{background:rgba(255,255,255,.2);color:#fff}
.seg .n.hot{background:var(--red);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills button{min-height:38px;padding:0 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.pills button[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.pills input[type=date]{min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .search{flex:1 1 220px;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
.bar select{min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;max-width:100%}

/* badge di stato */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:7px;padding:3px 8px;white-space:nowrap;line-height:1.3}
.st.new{background:var(--red);color:#fff}
.st.accepted{background:var(--black);color:#fff}
.st.preparing{background:var(--amber-50);color:var(--amber)}
.st.ready{background:var(--green-50);color:var(--green)}
.st.served{background:var(--soft);color:var(--ink-2)}
.st.cancelled{background:var(--soft);color:var(--muted);text-decoration:line-through}
.st.nuova{background:var(--red);color:#fff}
.st.confermata{background:var(--green-50);color:var(--green)}
.st.arrivata{background:var(--soft);color:var(--ink-2)}
.st.rifiutata,.st.annullata,.st.noshow{background:var(--soft);color:var(--muted)}
.st.noshow{color:var(--red-700)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.tag.red{background:var(--red-50);color:var(--red-700)}
.tag.amb{background:var(--amber-50);color:var(--amber)}
.tag.grn{background:var(--green-50);color:var(--green)}
.tag.blk{background:var(--black);color:#fff}

/* indicatori */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
button.kpi:hover{border-color:#cfcac4}
.kpi small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.kpi b.na{font-size:15px;font-weight:700;color:var(--muted);line-height:1.6}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.hot{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.kpi.hot b{color:var(--red)}
.sect{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.sect .lv{display:inline-flex;align-items:center;gap:6px;color:var(--green);letter-spacing:0;text-transform:none;font-weight:700}
.sect .lv:before{content:"";width:8px;height:8px;border-radius:99px;background:var(--green)}
.note-box{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note-box b{color:var(--ink)}
.warnbox{background:var(--amber-50);border:1px solid #f2d39b;color:#6b4100;border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.errbox{background:var(--red-50);border:1px solid var(--red-100);color:var(--red-700);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}

/* ordini */
.olist{display:grid;gap:10px}
.oc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;grid-template-columns:1fr auto}
.oc.late{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.oc.fresh{animation:fl 1.2s ease 3}
@keyframes fl{50%{box-shadow:0 0 0 6px var(--red-100)}}
.oc .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oc .num{font-weight:800;font-size:16px}
.oc .where{font-weight:800;font-size:16px}
.oc .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.oc .meta .el{font-weight:700;color:var(--ink-2)}
.oc.late .meta .el{color:var(--red)}
.oc .its{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.oc .its li{margin:1px 0}
.oc .its ul{margin:0;padding-left:18px}
.oc .on{font-size:13px;color:#6b4100;background:var(--amber-50);border-radius:8px;padding:4px 8px;margin-top:4px;display:block}
.oc .tot{font-weight:800;font-size:16px;text-align:right}
.oc .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tbl{border:1px solid var(--line);border-radius:16px;overflow:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{border-top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:800}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#faf9f7}

/* servizio */
.svc-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.svc-top .kpi b{font-size:34px}
.svc-cols{display:grid;gap:14px}
@media (min-width:900px){ .svc-cols{grid-template-columns:repeat(3,minmax(0,1fr))} }
.svc-col h3{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.svc-col h3 .n{min-width:26px;height:26px;border-radius:99px;background:var(--black);color:#fff;font-size:13px;display:inline-grid;place-items:center}
.svc .oc{padding:16px}
.svc .oc .num,.svc .oc .where{font-size:19px}
.svc .oc .its{font-size:16px}
.svc .oc .btn{min-height:54px;font-size:16px;flex:1}

/* tavoli */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tc{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:128px}
.tc:hover{border-color:#cfcac4}
.tc .tn1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tc .tn1 b{font-size:26px;font-weight:800;line-height:1}
.tc .ts{font-size:13px;font-weight:800}
.tc .tx{font-size:12.5px;color:var(--muted)}
.tc.busy{border-color:var(--black);background:#fff}
.tc.busy .ts{color:var(--black)}
.tc.free .ts{color:var(--green)}
.tc.att{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* prenotazioni */
.bday{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bday .tag{text-transform:none;letter-spacing:0}
.bk{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:70px 1fr;gap:4px 14px;margin-bottom:8px}
.bk.nuova{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.bk.rifiutata,.bk.annullata{opacity:.72}
.bk .tm{grid-row:span 4;font-size:22px;font-weight:800;line-height:1.1}
.bk .tm small{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}
.bk .who{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.bk .meta a{color:var(--ink-2);font-weight:700;text-decoration:none}
.bk .bn{font-size:13.5px;background:var(--amber-50);color:#6b4100;border-radius:8px;padding:5px 9px}
.bk .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;grid-column:1/-1}
.bk details{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bk details summary{cursor:pointer;font-weight:700;min-height:28px;display:flex;align-items:center}
.hist{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.hist li{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-2)}
.hist li time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px}

/* menu */
.cat{margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.cat h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.cat span{font-size:12px;color:var(--muted)}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.it{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it.dim .nm,.it.dim .th{opacity:.55}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:30px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.mv button:hover{background:var(--soft);color:var(--ink)}
.mv button:disabled{opacity:.25}
.th{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--soft)}
.nm b{display:block;font-size:15px;line-height:1.25}
.nm .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.nm small{color:var(--muted);font-size:12.5px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .pr{font-weight:800;min-width:64px;text-align:right}
.avb{min-height:40px;padding:0 10px 0 12px;border-radius:11px;border:1.5px solid var(--line);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:#fff;min-width:150px;justify-content:space-between}
.avb.ok{color:var(--green);border-color:#bfe3cc}
.avb.out{color:var(--red-700);border-color:var(--red-100);background:var(--red-50)}
.avb.off{color:var(--ink-2);background:var(--soft)}
.icb{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)}
.icb:hover{background:#e7e4e0;color:var(--ink)}
.icb[aria-pressed="true"]{background:var(--black);color:#fff}
@media (max-width:640px){
  .it{grid-template-columns:auto 44px minmax(0,1fr);gap:8px 10px}
  .th{width:44px;height:44px}
  .ctl{grid-column:1/-1;justify-content:flex-end;flex-wrap:wrap}
}
.menu-pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -15px rgba(0,0,0,.35);padding:6px;width:min(320px,calc(100vw - 24px))}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:10px;gap:2px}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--soft)}
.menu-pop button b{font-size:14px}
.menu-pop button span{font-size:12.5px;color:var(--muted)}
.menu-pop button[aria-checked="true"] b:after{content:" ✓";color:var(--green)}
.draft{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--black);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.draft b{font-size:14.5px}
.draft small{display:block;font-size:12px;color:#bdbdbd}
.draft .btn.ghost{background:transparent;color:#fff;border-color:#4a4a4a}
@media (min-width:1024px){ .draft{left:var(--side);padding-left:28px;padding-right:28px} }

/* finestre */
dialog{border:0;border-radius:20px;padding:0;width:min(640px,calc(100vw - 16px));max-height:calc(100dvh - 16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);color:var(--ink)}
dialog.wide{width:min(860px,calc(100vw - 16px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 16px)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0}
.db{padding:18px 20px;overflow:auto;display:grid;gap:14px;overscroll-behavior:contain}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
@media (max-width:560px){ dialog,dialog.wide{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0} .dlg{max-height:100dvh;height:100dvh} .df .btn{flex:1} }
.photo{display:flex;gap:14px;align-items:center}
.photo img{width:92px;height:92px;border-radius:14px;object-fit:cover;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;background:#fff}
.chip[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.ferr{color:var(--red);font-weight:700;font-size:13.5px;min-height:1em;margin:0}
.qtyr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qtyr:first-child{border-top:0}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:44px;height:44px;font-size:20px;font-weight:700}
.step b{min-width:30px;text-align:center}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td,.lines th{padding:8px 6px;border-top:1px solid var(--line)}
.lines th{background:none;font-size:11.5px}

/* grafici */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
.chart h3{margin:0;font-size:15px;font-weight:800}
.chart p{margin:2px 0 14px;font-size:12.5px;color:var(--muted)}
.how{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.vb{position:relative;height:190px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line);padding-top:8px}
.vb .gl{position:absolute;left:0;right:0;border-top:1px dashed #ebe8e4;pointer-events:none}
.vb .gl i{position:absolute;right:0;top:-15px;font-size:10.5px;font-style:normal;color:var(--muted)}
.vb .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.vb .bar{width:100%;max-width:26px;background:var(--black);border-radius:4px 4px 0 0}
.vb .col:hover .bar{background:var(--red)}
.vx{display:flex;gap:2px;margin-top:5px}
.vx span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.hbars{display:grid;gap:8px}
.hr{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hr .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:600}
.hr .t{height:14px;background:var(--soft);border-radius:0 4px 4px 0}
.hr .t i{display:block;height:100%;background:var(--black);border-radius:0 4px 4px 0}
.hr:hover .t i{background:var(--red)}
.hr .v{font-weight:700;text-align:right;min-width:70px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--black);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.funnel{display:grid;gap:8px}
.fn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.fn b{font-size:14px}
.fn span{font-size:12.5px;color:var(--muted);grid-column:1}
.fn .v{grid-row:1/span 2;grid-column:2;align-self:center;font-size:22px;font-weight:800}
.fn.na .v{font-size:13px;color:var(--muted);font-weight:700}

/* marina e impostazioni */
.faq{display:grid;gap:10px}
.fq{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:#fff}
.fq .row{justify-content:flex-end}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.hours{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center}
.hours label{font-weight:700;font-size:13.5px}
.hours input{min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;width:100%}
.clos{display:grid;gap:8px}
.clr{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;align-items:center}
.clr input{min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;width:100%;min-width:0}
@media (max-width:640px){ .clr{grid-template-columns:1fr 1fr auto} .clr input.cn{grid-column:1/3} }
.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mbox{display:flex;flex-direction:column;gap:8px}
.mbox .pv{height:130px;border-radius:14px;background:var(--black);display:grid;place-items:center;overflow:hidden;color:#fff;font-size:13px}
.mbox .pv img{width:100%;height:100%;object-fit:cover}
.mbox .pv.logo img{width:auto;height:80%;object-fit:contain}
.crow{display:flex;gap:6px;align-items:center}
.crow input{flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.crow small{color:var(--muted);font-size:12px;width:62px;text-align:right}
.stick{position:sticky;bottom:12px;z-index:5}

/* notifiche e messaggi */
.notif{position:fixed;right:12px;top:70px;z-index:60;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 50px -18px rgba(0,0,0,.35);padding:8px;max-height:70vh;overflow:auto}
.notif h3{margin:6px 8px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notif button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:12px;min-height:44px}
.notif button:hover{background:var(--soft)}
.notif .nd{width:9px;height:9px;border-radius:99px;margin-top:6px;flex-shrink:0;background:#b7b7b7}
.notif .nd.red{background:var(--red)}.notif .nd.green{background:var(--green)}
.notif p{margin:0;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--black);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--red)}
.toast.ok:before{content:"";width:8px;height:8px;border-radius:99px;background:#5fd38d;flex-shrink:0}
.flash{position:fixed;inset:0;pointer-events:none;z-index:85;box-shadow:inset 0 0 0 6px var(--red);opacity:0}
.flash.on{animation:fla 1.6s ease}
@keyframes fla{15%,55%{opacity:1}100%{opacity:0}}
body.sala .own{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<section class="gate" id="gate" hidden>
  <form id="pinForm" autocomplete="off">
    <div class="logo">CV</div>
    <h1>Via Roma 48</h1>
    <p>Pannello di gestione · inserisci il PIN</p>
    <label for="pin" class="sr">PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="current-password" type="password" maxlength="12" required>
    <button type="submit" class="btn dark lg" style="width:100%;margin-top:12px">Entra</button>
    <p class="err" id="pinErr" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
<div class="shell">
  <aside class="side" id="side" aria-label="Sezioni del pannello">
    <div class="brand"><span class="mk">CV</span><div><b id="bName">Via Roma 48</b><small>Cameriere Virtuale</small></div></div>
    <nav class="nav" id="nav">
      <span class="grp">Servizio</span>
      <button data-tab="home"><svg class="i"><use href="#i-home"/></svg><span class="t">Panoramica</span></button>
      <button data-tab="service"><svg class="i"><use href="#i-bolt"/></svg><span class="t">Durante il servizio</span></button>
      <button data-tab="orders"><svg class="i"><use href="#i-receipt"/></svg><span class="t">Ordini</span><span class="cnt" id="navOrd" hidden></span></button>
      <button data-tab="tables"><svg class="i"><use href="#i-table"/></svg><span class="t">Tavoli</span></button>
      <button data-tab="book"><svg class="i"><use href="#i-cal"/></svg><span class="t">Prenotazioni</span><span class="cnt" id="navBook" hidden></span></button>
      <span class="grp own">Gestione</span>
      <button data-tab="menu"><svg class="i"><use href="#i-book"/></svg><span class="t">Menu</span></button>
      <button data-tab="marina" class="own"><svg class="i"><use href="#i-chat"/></svg><span class="t">Ilaria</span></button>
      <button data-tab="info" class="own"><svg class="i"><use href="#i-store"/></svg><span class="t">Impostazioni</span></button>
      <span class="grp own">Risultati</span>
      <button data-tab="stats" class="own"><svg class="i"><use href="#i-chart"/></svg><span class="t">Statistiche</span></button>
      <button data-tab="visits" class="own"><svg class="i"><use href="#i-eye"/></svg><span class="t">Visite al menu</span></button>

// ---------- accesso ----------

// ---------- menu: pubblicato e bozza ----------
function draftKey(){ return "cv-admin-draft-" + KEY; }

function canon(p){ return { id: p.id, name: p.name, price: Number(p.price), img: p.img || null, desc: p.desc || "", ingr: p.ingr || "", all: (p.all || []).slice(), veg: !!p.veg, star: !!p.star, hidden: !!p.hidden, when: p.when || "", qty: typeof p.qty === "number" ? p.qty : null, all_ok: p.all_ok || "" }; }
function contentOf(cats){ return JSON.stringify(cats.map(function(c){ return { n: c.name, i: c.items.map(canon) }; })); }
async function loadMenu(){
  var j = await api("/api/menu?tutto=1");
  PUB = j.data; VER = j.version || 0; SOLD = j.sold || {}; CONTENT_AT = j.contentAt; UPDATED_AT = j.updatedAt; PUBAT = Date.now();

  var saved = null; try { saved = JSON.parse(ls(draftKey()) || "null"); } catch (e) {}
  if (saved && saved.cats && contentOf(saved.cats) !== contentOf(PUB.categories)) {
    DRAFT = saved.cats; DRAFT_BASE = saved.base || contentOf(PUB.categories);
    syncAvail(DRAFT);
  } else { DRAFT = clone(PUB.categories); DRAFT_BASE = contentOf(PUB.categories); ls(draftKey(), null); }
  paintDraft();
}
var DRAFT_BASE = "", PUBAT = 0;
// tiene aggiornato il menu pubblicato (disponibilità, porzioni vendute, impostazioni cambiate da altri dispositivi)
async function refreshPub(force){
  if (!PUB || (!force && Date.now() - PUBAT < 20000) || SAVING) return;
  PUBAT = Date.now();
  try {
    var j = await api("/api/menu?tutto=1");
    PUB = j.data; VER = j.version || 0; SOLD = j.sold || {}; CONTENT_AT = j.contentAt; UPDATED_AT = j.updatedAt;
    if (DRAFT) { if (!draftDirty()) { DRAFT = clone(PUB.categories); DRAFT_BASE = contentOf(PUB.categories); } else syncAvail(DRAFT); }
    LIVE.tables = PUB.restaurant.tables_count || LIVE.tables;
  } catch (e) {}
}
// la disponibilità del giorno arriva sempre dal pubblicato (si cambia subito, non con la bozza)
function syncAvail(cats){
  var by = {}; PUB.categories.forEach(function(c){ c.items.forEach(function(p){ by[p.id] = p; }); });
  cats.forEach(function(c){ c.items.forEach(function(p){ var o = by[p.id]; if (o) { p.av = o.av; if (o.out_until) p.out_until = o.out_until; else delete p.out_until; } }); });
}
function draftDirty(){ return !!DRAFT && contentOf(DRAFT) !== contentOf(PUB.categories); }
function draftChanged(){ ls(draftKey(), JSON.stringify({ cats: DRAFT, base: DRAFT_BASE })); paintDraft(); }
function draftCount(){
  if (!draftDirty()) return 0;
  var a = {}, b = {}, n = 0;
  PUB.categories.forEach(function(c){ c.items.forEach(function(p){ a[p.id] = JSON.stringify([c.name, canon(p)]); }); });
  DRAFT.forEach(function(c){ c.items.forEach(function(p){ b[p.id] = JSON.stringify([c.name, canon(p)]); }); });
  Object.keys(b).forEach(function(k){ if (a[k] !== b[k]) n++; });
  Object.keys(a).forEach(function(k){ if (!(k in b)) n++; });
  // ordine dei piatti cambiato in una categoria: una modifica per categoria
  DRAFT.forEach(function(c){
    var pc = PUB.categories.filter(function(x){ return x.name === c.name; })[0]; if (!pc) return;
    var ids = function(l){ return l.map(function(p){ return p.id; }).filter(function(id){ return a[id] && b[id]; }).join(); };
    if (ids(c.items) !== ids(pc.items)) n++;
  });
  if (JSON.stringify(PUB.categories.map(function(c){ return c.name; })) !== JSON.stringify(DRAFT.map(function(c){ return c.name; }))) n++;
  return Math.max(1, n);
}
function paintDraft(){
  var n = draftCount(), on = n > 0 && (CUR === "menu" || CUR === "marina") && ROLE === "titolare";

}

var SAVING = false;
// salva impostazioni del locale e risposte di Marina (subito, senza toccare la bozza del menu)
async function saveRestaurant(mut){
  SAVING = true;
  try {
    for (var i = 0; i < 3; i++) {
      var j = await api("/api/menu?tutto=1");
      var R = clone(j.data.restaurant); mut(R);

// ---------- sezioni ----------
var TABS = {

    var arrived = [];
    if (LIVE.known) o.forEach(function(x){ if (!LIVE.known[x.id] && x.status === "new") { arrived.push(x); LIVE.fresh[x.id] = Date.now(); } });
    LIVE.known = LIVE.known || {}; o.forEach(function(x){ LIVE.known[x.id] = 1; });
    LIVE.orders = o;
    if (r[1]) { LIVE.sessions = r[1].sessions || []; LIVE.tables = r[1].tables || LIVE.tables; }

    if (Date.now() - PUBAT > 60000) refreshPub();

      toast(arrived.length === 1 ? "Nuovo ordine #" + arrived[0].code + " · " + whereTxt(arrived[0]) : arrived.length + " nuovi ordini", "ok");

// avviso sonoro: il browser lo permette solo dopo un tocco dell'utente
var AC = null, SOUND = false, SOUNDPREF = ls("cv-admin-sound-" + KEY) === "1";
function paintSound(){
  var b = $("soundBtn"), pending = SOUNDPREF && !SOUND;
  b.setAttribute("aria-pressed", SOUND ? "true" : "false");
  b.innerHTML = ic(SOUND ? "vol" : "mute");
  b.title = SOUND ? "Avviso sonoro attivo: tocca per disattivarlo" : pending ? "Avviso sonoro da riattivare: tocca un punto qualsiasi della pagina" : "Avviso sonoro spento: tocca per attivarlo";

}
function beep(soft){
  if (!AC) return; var t0 = AC.currentTime + .02;
  (soft ? [[660, 0], [880, .18]] : [[880, 0], [1320, .16], [880, .55], [1320, .71]]).forEach(function(n){
    var o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = n[0];
    g.gain.setValueAtTime(.0001, t0 + n[1]); g.gain.exponentialRampToValueAtTime(.3, t0 + n[1] + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + n[1] + .3);
    o.connect(g).connect(AC.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + .33);
  });
}
function chime(soft){ if (SOUND && AC) { if (AC.state !== "running") AC.resume().then(function(){ beep(soft); }).catch(function(){}); else beep(soft); } }

$("soundBtn").onclick = function(e){
  e.stopPropagation();
  if (SOUND) { SOUND = false; SOUNDPREF = false; ls("cv-admin-sound-" + KEY, "0"); paintSound(); toast("Avviso sonoro disattivato"); return; }
  unlockSound(); if (SOUND) { SOUNDPREF = true; ls("cv-admin-sound-" + KEY, "1"); beep(); toast("Avviso sonoro attivo: suona a ogni nuovo ordine", "ok"); }
};

function prefixFor(ci){
  var c = DRAFT[ci];
  if (PREFIXES[c.name]) return PREFIXES[c.name];
  var cnt = {}; c.items.forEach(function(p){ var m = /^[A-Z]+/.exec(p.id); if (m) cnt[m[0]] = (cnt[m[0]] || 0) + 1; });
  var best = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; })[0];
  if (best) return best;
  var used = {}; dAll().forEach(function(x){ used[/^[A-Z]+/.exec(x.p.id)[0]] = 1; });
  var first = norm(c.name).replace(/[^a-z]/g, "").toUpperCase().charAt(0) || "X";
  if (!used[first]) return first;
  for (var i = 0; i < 26; i++) { var L = String.fromCharCode(65 + i); if (!used[L]) return L; }
  return "X" + first;
}
function newId(ci){

  dAll().forEach(function(x){ ids[x.p.id] = 1; var m = new RegExp("^" + pre + "(\\d+)$").exec(x.p.id); if (m) max = Math.max(max, +m[1]); });
  var n = max + 1, id;
  do { id = pre + String(n).padStart(2, "0"); n++; } while (ids[id]);

}
function squareImage(file, size){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var s = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement("canvas");
      cv.width = cv.height = Math.min(size, s);
      cv.getContext("2d").drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ if (b && b.type === "image/webp") return res(b); cv.toBlob(function(j){ j ? res(j) : rej(new Error("immagine non leggibile")); }, "image/jpeg", 0.82); }, "image/webp", 0.82);
    };
    im.onerror = function(){ rej(new Error("formato non supportato")); };
    im.src = url;
  });
}

function fitImage(file, maxW, maxH, keepAlpha){

      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      var tryType = function(types){ if (!types.length) return rej(new Error("immagine non leggibile")); cv.toBlob(function(b){ if (b && b.type === types[0] && b.size < 600 * 1024) res(b); else tryType(types.slice(1)); }, types[0], 0.8); };
      tryType(keepAlpha ? ["image/webp", "image/png"] : ["image/webp", "image/jpeg"]);
    };
    im.onerror = function(){ rej(new Error("formato non supportato")); };
    im.src = url;
  });
}

    var h0 = Math.min(11, Math.min.apply(null, hrs)), h1 = Math.max(23, Math.max.apply(null, hrs));

    html += '<div class="card chart"><h3>Fasce orarie</h3><p>Ordini per ora · il più affollato: <b>' + peak.h + ":00–" + (peak.h + 1) + ":00</b> (" + peak.orders + ")</p>" +
      vbars(s.byHour.slice(h0, h1 + 1).map(function(h){ return { x: String(h.h), v: h.orders, h: h }; }), function(x){ return Math.round(x); }, function(r){ return r.h.h + ":00–" + (r.h.h + 1) + ":00 · " + r.h.orders + " ordini · " + euro(r.h.revenue); }) +
      '<div class="how">Ora in cui l\'ordine è arrivato al sistema, ordini annullati esclusi.</div></div>';
    if (s.byDay.length > 1) html += '<div class="card chart"><h3>Valore degli ordini per giorno</h3><p>Totale ' + euro(s.revenue) + " in " + s.byDay.length + " giorni</p>" +
      vbars(s.byDay.map(function(d){ return { x: s.byDay.length > 10 ? d.date.slice(8) : new Date(d.date + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric" }), v: d.revenue, d: d }; }), function(x){ return "€" + Math.round(x); }, function(r){ return longD(r.d.date) + " · " + euro(r.d.revenue) + " · " + r.d.orders + " ordini"; }) + "</div>";
    html += '<div class="card chart"><h3>Piatti più ordinati</h3><p>Per quantità</p>' + hbars(s.topProducts.slice(0, 10).map(function(p){ return { x: p.name, v: p.qty, p: p }; }), function(r){ return r.p.qty + " × · " + euro(r.p.revenue); }, function(r){ return r.p.name + " · " + r.p.qty + " ordinati · " + euro(r.p.revenue); }) + '<div class="how">Con il nome che il piatto aveva al momento dell\'ordine.</div></div>';
    html += '<div class="card chart"><h3>Categorie</h3><p>Valore degli ordini per categoria</p>' + hbars(s.byCategory.map(function(c){ return { x: c.cat, v: c.revenue, c: c }; }), function(r){ return euro(r.c.revenue); }, function(r){ return r.c.cat + " · " + euro(r.c.revenue) + " · " + r.c.qty + " pezzi"; }) + "</div>";
    html += '<div class="card chart"><h3>Tavoli e asporto</h3><p>Valore degli ordini per tavolo</p>' + hbars(s.byTable.slice(0, 10).map(function(t){ return { x: t.table === "asporto" ? "Asporto" : "Tavolo " + t.table, v: t.revenue, t: t }; }), function(r){ return euro(r.t.revenue); }, function(r){ return r.x + " · " + r.t.orders + " ordini · " + euro(r.t.revenue); }) + "</div>";
    html += '<div class="card chart"><h3>Tempi di preparazione</h3><p>Media dalla ricezione dell\'ordine a “pronto”</p><div class="kpis" style="margin:0">' + kpi("Tempo medio", s.avgPrepMin == null ? null : s.avgPrepMin + " min", "") + '</div><div class="how">Calcolato solo sugli ordini che la cucina ha segnato come pronti (esclusi valori oltre 4 ore).</div></div>';
  } else html += '<div class="card">' + stateHtml("empty", "Nessun ordine registrato in questo periodo", "Grafici di fasce orarie, piatti e categorie compaiono quando ci sono ordini.") + "</div>";
  if (v && v.sessions) {
    var F = [["Visite al menu", v.funnel.visite], ["Hanno aggiunto piatti", v.funnel.carrello], ["Sono arrivati al riepilogo", v.funnel.riepilogo], ["Hanno inviato un ordine", v.funnel.ordine]];
    html += '<div class="card chart"><h3>Percorso dal menu all\'ordine</h3><p>Quante visite arrivano a ogni passo</p>' + hbars(F.map(function(f){ return { x: f[0], v: f[1] }; }), function(r){ return r.v + " · " + pct(r.v, v.sessions); }, function(r){ return r.x + ": " + r.v; }) + '<div class="how">Una visita è un\'apertura del menu da un browser; se la stessa persona torna più tardi conta come nuova visita.</div></div>';
  }
  html += "</div>";
  $("stBox").innerHTML = html;
}
function pct(a, b){ return b ? Math.round(a / b * 100) + "%" : NA; }

// VISITE AL MENU
// =====================================================================================
var EVN = [["marina", "Apre la chat con " + WAITER], ["marina_msg", "Messaggi a " + WAITER], ["carrello", "Apre il carrello"], ["riepilogo", "Riepilogo dell'ordine (carrello)"], ["riepilogo_chat", "Riepilogo dell'ordine (chat)"],
  ["ordine", "Ordini al tavolo inviati"], ["ordine_asporto", "Ordini da asporto inviati"], ["wa_ordine", "WhatsApp aperto con un ordine"], ["stato_ordine", "Controlla lo stato dell'ordine"],
  ["prenota", "Tocca Prenota"], ["prenota_riepilogo", "Riepilogo della prenotazione"], ["prenota_whatsapp", "WhatsApp aperto con una prenotazione"], ["chiama", "Tocca Chiama"], ["info", "Tocca Info"],
  ["indicazioni", "Indicazioni stradali"], ["voto", "Lascia un voto"], ["recensione_google", "Va alla recensione Google"], ["sezioni_home", "Torna all'elenco sezioni"]];
function dur(sec){ if (!sec) return null; var m = Math.floor(sec / 60), s2 = sec % 60; return m ? m + " min " + (s2 ? s2 + " s" : "") : s2 + " s"; }
RENDER.visits = function(){
  var P = qs('[data-panel="visits"]');
  P.innerHTML = '<div style="margin-bottom:14px">' + periodsHtml("vPer") + '</div><div id="visBox">' + LOADING() + "</div>";
  bindPeriods("vPer", RENDER.visits);
  loadVisits();
};
async function loadVisits(){
  var v;
  try { v = await api("/api/eventi?dal=" + PER.dal + "&al=" + PER.al); }
  catch (e) { if ($("visBox")) $("visBox").innerHTML = stateHtml("err", "Visite non caricate", errMsg(e)); return; }
  if (!$("visBox")) return;
  var html = '<p class="sub" style="text-transform:capitalize">' + esc(perLabel()) + "</p><div class=\"kpis\">" +
    kpi("Visite", v.sessions, "aperture del menu") + kpi("Dispositivi/browser unici", v.visitors, "lo stesso cliente con due telefoni conta due volte") +
    kpi("Tempo medio sul menu", v.sessions ? dur(v.avgDur) : null, "per visita") + kpi("Dal QR del tavolo", v.sessions ? pct(v.src.qr, v.sessions) : null, v.src.qr + " visite · " + v.src.sito + " dal sito") +
    kpi("Da telefono", v.sessions ? pct(v.dev.mobile, v.sessions) : null, v.dev.desktop + " da computer") + kpi("Visite con ordine", v.sessions ? pct(v.funnel.ordine, v.sessions) : null, v.funnel.ordine + " visite con un ordine inviato") +
    kpi("Uscite subito", v.sessions ? pct(v.bounce, v.sessions) : null, "meno di 10 secondi, senza guardare nulla") + "</div>" +
    '<p class="hint" style="margin:-4px 0 16px">Statistiche anonime: nessun dato personale. Le visite fatte da questo dispositivo (con il pannello aperto) non vengono contate.</p>';
  if (!v.sessions) { $("visBox").innerHTML = html + stateHtml("empty", "Nessuna visita in questo periodo", ""); return; }
  html += '<div class="charts">';
  var hrs = v.byHour.map(function(n, h){ return { h: h, n: n }; }).filter(function(x){ return x.n; }).map(function(x){ return x.h; });
  var h0 = Math.min(10, Math.min.apply(null, hrs)), h1 = Math.max(23, Math.max.apply(null, hrs));
  html += '<div class="card chart"><h3>Quando guardano il menu</h3><p>Visite per ora</p>' + vbars(v.byHour.slice(h0, h1 + 1).map(function(n, i){ return { x: String(h0 + i), v: n, h: h0 + i }; }), function(x){ return Math.round(x); }, function(r){ return r.h + ":00–" + (r.h + 1) + ":00 · " + r.v + " visite"; }) + "</div>";
  if (v.byDay.length > 1) html += '<div class="card chart"><h3>Visite per giorno</h3><p>' + v.sessions + " visite in " + v.byDay.length + " giorni</p>" + vbars(v.byDay.map(function(d){ return { x: v.byDay.length > 10 ? d.date.slice(8) : new Date(d.date + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric" }), v: d.sessions, d: d }; }), function(x){ return Math.round(x); }, function(r){ return longD(r.d.date) + " · " + r.d.sessions + " visite · " + r.d.visitors + " dispositivi"; }) + "</div>";
  var secs = Object.keys(v.sec).map(function(k){ return { x: k, v: v.sec[k], t: v.secTime[k] || 0 }; }).sort(function(a, b){ return b.v - a.v; });
  if (secs.length) html += '<div class="card chart"><h3>Sezioni più viste</h3><p>Aperture e tempo medio nella sezione</p>' + hbars(secs, function(r){ return r.v + " · " + (dur(Math.round(r.t / r.v)) || "—"); }, function(r){ return r.x + " · " + r.v + " aperture"; }) + "</div>";
  var name = function(id){ var f = pubById(id); return f ? f.p.name : id; };
  var opens = Object.keys(v.dishOpen).map(function(k){ return { x: name(k), v: v.dishOpen[k] }; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 10);
  if (opens.length) html += '<div class="card chart"><h3>Piatti più guardati</h3><p>Schede dei piatti aperte</p>' + hbars(opens, function(r){ return r.v + " ×"; }, function(r){ return r.x + " · " + r.v; }) + "</div>";
  var adds = Object.keys(v.dishAdd).map(function(k){ return { x: name(k), v: v.dishAdd[k] }; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 10);
  if (adds.length) html += '<div class="card chart"><h3>Piatti aggiunti al carrello</h3><p>Anche quelli poi non ordinati</p>' + hbars(adds, function(r){ return r.v + " ×"; }, function(r){ return r.x + " · " + r.v; }) + "</div>";
  var mqs = Object.keys(v.mq || {}).map(function(k){ return { x: k.replace(/^Messaggio: /, "Scrive di: ").replace(/^Pulsante: /, "Tocca: "), v: v.mq[k] }; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 20);
  if (mqs.length) html += '<div class="card chart"><h3>Cosa chiedono a ' + WAITER + '</h3><p>Argomenti dei messaggi e risposte rapide toccate</p>' + hbars(mqs, function(r){ return r.v + " ×"; }, function(r){ return r.x + " · " + r.v; }) + '<div class="how">Solo l\'argomento, non il testo: nessun dato personale.</div></div>';
  var evs = EVN.filter(function(e){ return v.ev[e[0]]; }).map(function(e){ return { x: e[1], v: v.ev[e[0]] }; }).sort(function(a, b){ return b.v - a.v; });
  if (evs.length) html += '<div class="card chart"><h3>Pulsanti e azioni</h3><p>Quante volte è stato toccato ogni pulsante</p>' + hbars(evs, function(r){ return r.v + " ×"; }, function(r){ return r.x + " · " + r.v; }) + '<div class="how">“WhatsApp aperto” conta i tocchi sul pulsante: non indica che il messaggio sia stato inviato.</div></div>';
  html += "</div>";
  $("visBox").innerHTML = html;
}

function starTxt(n){ return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n); }
RENDER.reviews = function(){
  var P = qs('[data-panel="reviews"]');
  P.innerHTML = '<div style="margin-bottom:14px">' + periodsHtml("rPer") + '</div><div id="revBox">' + LOADING() + "</div>";
  bindPeriods("rPer", RENDER.reviews);
  loadReviews();
};
async function loadReviews(){
  var r;
  try { r = await api("/api/recensioni?dal=" + PER.dal + "&al=" + PER.al); }
  catch (e) { if ($("revBox")) $("revBox").innerHTML = stateHtml("err", "Feedback non caricati", errMsg(e)); return; }
  if (!$("revBox")) return;
  var g = PUB.restaurant.google_review_url;
  var html = '<p class="sub"><span style="text-transform:capitalize">' + esc(perLabel()) + "</span> · Voti lasciati dai clienti nel menu dopo che l'ordine è stato servito. <b>Non sono recensioni Google</b> e non sono pubbliche.</p>" +
    '<div class="kpis">' + kpi("Voto medio", r.avg == null ? null : r.avg.toFixed(1).replace(".", ",") + " / 5", "") + kpi("Voti ricevuti", r.count, "") +
    kpi("Link alle recensioni Google", g ? "Attivo" : "Non impostato", g ? "dopo un voto alto, il cliente può lasciare anche una recensione su Google" : "aggiungilo in Impostazioni → Contatti", { go: g ? "" : "info" }) + "</div>";
  if (!r.count) { $("revBox").innerHTML = html + stateHtml("empty", "Nessun voto in questo periodo", "I clienti possono votare quando il loro ordine è segnato come servito."); return; }
  var max = Math.max.apply(null, r.dist) || 1;
  html += '<div class="charts"><div class="card chart"><h3>Distribuzione dei voti</h3><p>Quante volte è stato dato ogni voto</p><div class="hbars">' +
    [5, 4, 3, 2, 1].map(function(n){ var v = r.dist[n - 1]; return '<div class="hr" data-tip="' + n + " stelle · " + v + ' voti"><span class="l" style="letter-spacing:.05em">' + starTxt(n) + '</span><span class="t"><i style="width:' + (v / max * 100) + '%"></i></span><span class="v tn">' + v + "</span></div>"; }).join("") + "</div></div>";
  var com = r.reviews.filter(function(x){ return x.comment; });
  html += '<div class="card chart"><h3>Commenti</h3><p>' + com.length + " commenti scritti</p>" + (com.length ? '<div style="display:grid;gap:10px">' + com.slice(0, 100).map(function(x){
    return '<div style="border-top:1px solid var(--line);padding-top:10px"><div class="row" style="justify-content:space-between;font-size:12.5px;color:var(--muted)"><span style="font-size:15px;color:var(--ink)">' + starTxt(x.stars) + "</span><span>" + dmy(x.createdAt) + " " + hm(x.createdAt) + " · #" + esc(x.code) + " · " + (x.type === "asporto" ? "Asporto" : "Tavolo " + x.table) + '</span></div><p style="margin:4px 0 0;font-size:14.5px">' + esc(x.comment) + "</p></div>";
  }).join("") + "</div>" : stateHtml("empty", "Nessun commento scritto", "")) + "</div></div>";
  $("revBox").innerHTML = html;
}

var _show = showTab;
showTab = function(name){
  if (name !== CUR && LEAVE && LEAVE()) {
    ask("Uscire senza salvare?", "In questa sezione ci sono modifiche non salvate.", "Esci senza salvare", true).then(function(ok){ if (ok) { LEAVE = null; _show(name); } });

};
