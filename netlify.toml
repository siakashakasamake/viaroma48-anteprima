[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# le pagine di servizio non vanno indicizzate
[[headers]]
  for = "/cucina.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/tavoli.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"
